<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Macaco Te Responde 🐒</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #2b2b2b, #080808 70%);
      color: white;
      padding: 20px;
    }
    .card {
      width: min(92vw, 700px);
      text-align: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 6vw, 44px); }
    p { opacity: .8; margin: 0 0 18px; }
    img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 16px;
      display: block;
      background: #111;
    }
    button {
      margin-top: 18px;
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #111;
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255,255,255,.18); }
    #resposta { margin-top: 15px; min-height: 24px; font-weight: bold; }
  
    .surpresa {
      width: min(92vw, 700px);
      text-align: center;
      position: relative;
      cursor: pointer;
    }
    .caixa { width: 180px; height: 145px; margin: 0 auto; position: relative; z-index: 4; transform-origin: bottom center; transition: transform .3s; }
    .corpo { position: absolute; bottom: 0; left: 10px; width: 160px; height: 105px; border-radius: 10px 10px 18px 18px; background: linear-gradient(135deg,#ff4b4b,#b90000); font-size: 58px; display:flex; align-items:center; justify-content:center; box-shadow:0 15px 35px rgba(0,0,0,.45); }
    .tampa { position:absolute; z-index:2; top:20px; left:0; width:180px; height:42px; border-radius:8px; background:linear-gradient(135deg,#ff6868,#c50000); font-size:28px; display:flex; align-items:center; justify-content:center; transition:transform .55s cubic-bezier(.2,.8,.2,1); box-shadow:0 8px 20px rgba(0,0,0,.35); }
    .caixa.aberta .tampa { transform:translateY(-95px) rotate(-12deg); }
    .caixa.sumiu { opacity:0; transform:scale(.7) translateY(30px); pointer-events:none; transition:opacity .35s, transform .35s; }
    .instrucao.sumiu { opacity:0; transition:opacity .25s; pointer-events:none; }
    .caixa:hover { transform:scale(1.04); }
    .instrucao { margin:22px 0 0; font-weight:bold; font-size:18px; opacity:.9; }
    .macaco { position:absolute; left:50%; bottom:105px; width:min(78vw,430px); transform:translate(-50%,100px) scale(.55); opacity:0; z-index:3; transition:transform .65s cubic-bezier(.17,.67,.3,1.25), opacity .25s; pointer-events:none; }
    .macaco img { width:100%; max-height:52vh; object-fit:contain; border-radius:16px; display:block; box-shadow:0 20px 50px rgba(0,0,0,.55); }
    .macaco.saiu { transform:translate(-50%,-15px) scale(1); opacity:1; }
    .conteudo { margin-top:20px; opacity:0; transform:translateY(20px); transition:.45s ease; pointer-events:none; }
    .conteudo.apareceu { opacity:1; transform:translateY(0); pointer-events:auto; }
    .conteudo h1 { margin:0 0 8px; font-size:clamp(26px,6vw,44px); }
    .conteudo p { opacity:.8; margin:0 0 18px; }
    .conteudo button { margin-top:18px; border:0; border-radius:999px; padding:14px 24px; font-size:17px; font-weight:bold; cursor:pointer; background:white; color:#111; transition:transform .15s,box-shadow .15s; }
    .conteudo button:hover { transform:scale(1.05); box-shadow:0 8px 25px rgba(255,255,255,.18); }
    #resposta { margin-top:15px; min-height:24px; font-weight:bold; }
</style>
</head>
<body>
  <main class="surpresa" onclick="abrirCaixa()">
    <div class="caixa" id="caixa">
      <div class="tampa">🎀</div>
      <div class="corpo">🎁</div>
    </div>
    <p class="instrucao" id="instrucao">Clique na caixa para abrir 🎁</p>
    <div class="macaco" id="macaco">
      <img src="macaco.jpg" alt="Meme do macaco fazendo um gesto">
    </div>
    <section class="conteudo" id="conteudo">
      <h1>🐒 O Macaco Tem Algo a Dizer</h1>
      <p>Clique no botão se tiver coragem.</p>
      <button onclick="event.stopPropagation(); responder()">CLIQUE AQUI</button>
      <div id="resposta"></div>
    </section>
  </main>

  <script>
    const respostas = [
      "O macaco já respondeu. 🐒",
      "Ele não parece muito feliz com você. 😂",
      "Resposta recebida com sucesso. 👍",
      "O macaco disse: hoje não. 😭",
      "Você realmente clicou nisso? 💀"
    ];

    function abrirCaixa() {
      const caixa = document.getElementById('caixa');
      if (caixa.classList.contains('aberta')) return;
      caixa.classList.add('aberta');
      document.getElementById('instrucao').textContent = 'SURPRESA! 🐒';
      document.getElementById('macaco').classList.add('saiu');
      setTimeout(() => {
        document.getElementById('caixa').classList.add('sumiu');
        document.getElementById('instrucao').classList.add('sumiu');
      }, 650);
      setTimeout(() => document.getElementById('conteudo').classList.add('apareceu'), 800);
    }

    function responder() {
      const r = respostas[Math.floor(Math.random() * respostas.length)];
      document.getElementById('resposta').textContent = r;
    }
  </script>
</body>
</html>
